{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7">

        <div class="card shadow-sm">

            <div class="card-body">

                <h3 class="mb-3">
                    Book Appointment
                </h3>

                <p class="text-muted">
                    Select a doctor and appointment date.
                    Your queue token will be generated automatically.
                </p>


                <form method="post">

                    <!-- =================================================
                         DOCTOR
                    ================================================== -->

                    <div class="mb-3">

                        <label class="form-label">
                            Doctor *
                        </label>

                        <select
                            class="form-select"
                            name="doctor_id"
                            required>

                            <option value="">
                                Select Doctor
                            </option>

                            {% for doctor in doctors %}

                            <option value="{{ doctor.id }}">

                                {{ doctor.name }}
                                -
                                {{ doctor.specialization }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <!-- =================================================
                         DATE
                    ================================================== -->

                    <div class="mb-3">

                        <label class="form-label">
                            Appointment Date *
                        </label>

                        <input
                            type="date"
                            class="form-control"
                            name="appointment_date"
                            min="{{ today }}"
                            required>

                    </div>


                    <!-- =================================================
                         TIME INFORMATION
                    ================================================== -->

                    <div class="alert alert-info">

                        <strong>Note:</strong>

                        You do not need to select an appointment time.

                        <br>

                        Your queue token will be generated automatically
                        after booking.

                    </div>


                    <!-- =================================================
                         BOOK
                    ================================================== -->

                    <button
                        type="submit"
                        class="btn btn-primary w-100">

                        Book Appointment

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
