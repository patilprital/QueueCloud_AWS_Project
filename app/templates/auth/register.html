{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-5">
<div class="card p-4 shadow-sm">
<h3 class="mb-3">Patient Registration</h3>
<form method="post">
<input class="form-control mb-3" name="name" placeholder="Full Name" required>
<input class="form-control mb-3" type="email" name="email" placeholder="Email" required>
<input class="form-control mb-3" type="password" name="password" minlength="6" placeholder="Password (minimum 6 characters)" required>
<button class="btn btn-primary w-100">Create Account</button>
</form>
</div></div></div>
{% endblock %}
