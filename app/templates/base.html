<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QueueCloud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('auth.home') }}">QueueCloud</a>
        <div>
            {% if session.get('user_id') %}
                <span class="text-white me-3">Hi, {{ session.get('name') }}</span>
                <a class="btn btn-light btn-sm" href="{{ url_for('auth.logout') }}">Logout</a>
            {% else %}
                <a class="btn btn-light btn-sm me-2" href="{{ url_for('auth.login') }}">Login</a>
                <a class="btn btn-outline-light btn-sm" href="{{ url_for('auth.register') }}">Register</a>
            {% endif %}
        </div>
    </div>
</nav>

<main class="container py-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
